<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>nii adjetey — Home</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap">
</head>
<body>
  <!-- ===== HEADER / HOME HERO ===== -->
  <div id="header">
    <div class="container">
      <nav>
        <div class="logo">
          <h1><a href="index.html"><span>B</span>ISMARCK</a></h1>
        </div>
        <i class="fas fa-bars" id="menu-icon"></i>
        <ul id="nav-menu">
          <li><a href="index.html" class="active-page" onclick="closeMenu()">Home</a></li>
          <li><a href="about.html" onclick="closeMenu()">About</a></li>
          <li><a href="services.html" onclick="closeMenu()">Services</a></li>
          <li><a href="portfolio.html" onclick="closeMenu()">Portfolio</a></li>
          <li><a href="album.html" onclick="closeMenu()">Album</a></li>
          <li><a href="wall.html" onclick="closeMenu()">Wall</a></li>
          <li><a href="contact.html" onclick="closeMenu()">Contact</a></li>
          <li><a href="dashboard.html" onclick="closeMenu()">Dashboard</a></li>
        </ul>
      </nav>
      <div class="header-text">
        <p>Embedded Engineer/ Web Developer/ Data Analyst</p>
        <h1>Hi, I'm <span>Adjei</span><br />Bismarck from Ghana</h1>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast"></div>

  <!-- ===== FOOTER ===== -->
  <footer>
    <div class="container">
      <p>&copy; 2025 Adjei Bismarck. All Rights Reserved.</p>
      <div class="footer-social">
        <a href="https://www.linkedin.com/in/niiadjetey" target="_blank" title="LinkedIn"><i class="fa-brands fa-linkedin"></i></a>
        <a href="https://github.com/adjetey0" target="_blank" title="GitHub"><i class="fa-brands fa-github"></i></a>
        <a href="https://x.com/mradjeteynii" target="_blank" title="Twitter/X"><i class="fa-brands fa-twitter"></i></a>
        <a href="https://www.instagram.com/west.xds" target="_blank" title="Instagram"><i class="fa-brands fa-instagram"></i></a>
      </div>
    </div>
  </footer>

  <!-- Back to Top Button -->
  <button id="back-to-top" class="back-to-top" title="Back to Top">
    <i class="fa-solid fa-arrow-up"></i>
  </button>

  <script>
    // Mobile menu toggle
    const menuIcon = document.getElementById('menu-icon');
    const navMenu = document.getElementById('nav-menu');

    if (menuIcon && navMenu) {
      menuIcon.addEventListener('click', function() {
        navMenu.classList.toggle('active');
        if (menuIcon.classList.contains('fa-bars')) {
          menuIcon.classList.remove('fa-bars');
          menuIcon.classList.add('fa-times');
        } else {
          menuIcon.classList.remove('fa-times');
          menuIcon.classList.add('fa-bars');
        }
      });
    }

    function closeMenu() {
      if (navMenu) {
        navMenu.classList.remove('active');
      }
      if (menuIcon) {
        menuIcon.classList.remove('fa-times');
        menuIcon.classList.add('fa-bars');
      }
    }

    // Back to Top Button Functionality
    const backToTopBtn = document.getElementById('back-to-top');
    window.addEventListener('scroll', function() {
      if (window.pageYOffset > 300) {
        backToTopBtn.classList.add('show');
      } else {
        backToTopBtn.classList.remove('show');
      }
    });
    backToTopBtn.addEventListener('click', function() {
      window.scrollTo({
        top: 0,
        behavior: 'smooth'
      });
    });
  </script>
</body>
</html>
